# Services locaux de développement : base PostgreSQL/PostGIS + faux serveur mail.
# Lancer : docker compose up -d
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: apex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "5432:5432"
    volumes:
      - apex-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    # Mailpit capture tous les e-mails envoyés par l'app : interface sur http://localhost:8025
    image: axllent/mailpit:v1.27
    container_name: apex-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  apex-db-data:
